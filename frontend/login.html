<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Memorium — Sign In</title>
    <meta name="title" content="Memorium — Sign In" />
    <meta name="description" content="Sign in to your Memorium account" />
    <meta name="keywords" content="login, sign in, account" />
    <meta name="author" content="Memorium" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://memorium.app/login" />
    <meta property="og:title" content="Memorium — Sign In" />
    <meta property="og:description" content="Sign in to your Memorium account" />
    <meta property="og:image" content="https://memorium.app/assets/images/og-image.jpg" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#4A3428" />
    <meta name="msapplication-TileColor" content="#4A3428" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Caveat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/animation.css" />
    <link rel="stylesheet" href="css/responsive.css" />

    <style>
      /* Login Page Specific Styles */
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--background);
      }

      .login-container {
        max-width: 420px;
        width: 100%;
        padding: var(--space-8) var(--space-5);
      }

      .login-brand {
        text-align: center;
        margin-bottom: var(--space-8);
      }

      .login-brand .gold {
        color: var(--accent-gold);
      }

      .login-brand h1 {
        font-family: var(--font-heading);
        font-size: var(--fs-3xl);
        font-weight: var(--fw-bold);
        color: var(--color-primary-dark);
        margin-bottom: var(--space-2);
      }

      .login-brand p {
        color: var(--color-text-light);
        font-size: var(--fs-sm);
      }

      .form-group {
        margin-bottom: var(--space-5);
      }

      .form-group label {
        display: block;
        font-family: var(--font-heading);
        font-size: var(--fs-sm);
        font-weight: var(--fw-semibold);
        color: var(--color-text-dark);
        margin-bottom: var(--space-2);
      }

      .form-group input {
        width: 100%;
        padding: var(--input-padding-x) var(--input-padding-y);
        height: var(--input-height);
        background: var(--paper);
        border: 1px solid var(--border);
        border-radius: var(--input-radius);
        font-family: var(--body-font);
        font-size: var(--fs-md);
        color: var(--color-text-dark);
        transition:
          border-color var(--transition-normal),
          box-shadow var(--transition-normal);
      }

      .form-group input:focus {
        outline: none;
        border-color: var(--color-primary);
        box-shadow: 0 0 0 3px rgba(107, 79, 59, 0.15);
      }

      .remember-forgot {
        display: flex;
        justify-content: space-between;
        font-size: var(--fs-sm);
        margin-bottom: var(--space-6);
        color: var(--color-text-muted);
      }

      .remember-forgot a {
        color: var(--color-primary);
        text-decoration: underline;
      }

      .btn-fullwidth {
        width: 100%;
        padding: var(--button-padding-y) var(--button-padding-x);
      }

      .login-link {
        text-align: center;
        margin-top: var(--space-6);
        font-size: var(--fs-sm);
        color: var(--color-text-muted);
      }

      .login-link a {
        color: var(--color-primary);
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <!-- ============================================================
         NAVBAR
         ============================================================ -->
    <header class="navbar" id="navbar" role="banner">
      <nav class="nav-container" aria-label="Main navigation">
        <!-- Brand Logo -->
        <a href="index.html" class="nav-brand" aria-label="Memorium Home">
          <span class="nav-brand-icon">📖</span>
          Memor<span>ium</span>
        </a>

        <!-- Navigation Links -->
        <ul class="nav-links" role="list">
          <li><a href="index.html" class="nav-link active">Home</a></li>
          <li><a href="bookshelf.html" class="nav-link">My Journals</a></li>
          <li><a href="journal.html" class="nav-link">Journal</a></li>
          <li><a href="register.html" class="btn btn-primary btn-sm">Get Started</a></li>
        </ul>

        <!-- Mobile Toggle -->
        <button
          class="nav-toggle"
          id="navToggle"
          aria-label="Toggle navigation menu"
          aria-expanded="false"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
      </nav>
    </header>

    <!-- ============================================================
         MAIN CONTENT
         ============================================================ -->
    <main style="max-width: 600px; margin: 0 auto; padding: var(--space-8) var(--space-5)">
      <div class="login-container">
        <div class="login-brand">
          <h1>Welcome Back</h1>
          <p>Sign in to continue your journal</p>
        </div>

        <form>
          <div class="form-group">
            <label for="email">Email address</label>
            <input type="email" id="email" placeholder="Enter your email" required />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required />
          </div>

          <div class="remember-forgot">
            <label style="flex: 1"> <input type="checkbox" id="remember" /> Remember me </label>
            <a href="forgot.html">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn-primary btn-fullwidth">Sign In</button>
        </form>

        <div class="login-link">
          Don't have an account? <a href="register.html">Create account</a>
        </div>
      </div>
    </main>

    <!-- ============================================================
         FOOTER
         ============================================================ -->
    <footer class="footer">
      <div class="footer-content">
        <p>&copy; 2026 Memorium. Crafted for memory keepers.</p>
        <p class="footer-quote">"Some memories should grow old with you."</p>
      </div>
    </footer>

    <!-- ============================================================
         SCRIPTS
         ============================================================ -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>

    <script>
      // Inline critical JS for immediate interactivity
      (function () {
        // Navbar scroll effect
        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', function () {
          if (window.scrollY > 50) {
            navbar.classList.add('scrolled');
          } else {
            navbar.classList.remove('scrolled');
          }
        });

        // Mobile nav toggle
        const toggle = document.getElementById('navToggle');
        const navLinks = document.querySelector('.nav-links');
        let menuOpen = false;

        toggle.addEventListener('click', function () {
          menuOpen = !menuOpen;
          toggle.setAttribute('aria-expanded', menuOpen);
          // Full mobile menu functionality in app.js
        });

        // Active nav link on scroll
        const sections = document.querySelectorAll('section[id]');
        const navItems = document.querySelectorAll('.nav-link');

        window.addEventListener('scroll', function () {
          let current = '';
          sections.forEach(function (section) {
            const sectionTop = section.offsetTop - 100;
            if (window.scrollY >= sectionTop) {
              current = section.getAttribute('id');
            }
          });

          navItems.forEach(function (link) {
            link.classList.remove('active');
            if (link.getAttribute('href') === '#' + current) {
              link.classList.add('active');
            }
          });
        });
      })();
    </script>
  </body>
</html>
